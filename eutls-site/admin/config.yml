# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: rjrhealey/eutls-website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/7e007459-048e-4989-95a1-7a11b60d2fe8/pkce
  auth_token_endpoint: /sites/7e007459-048e-4989-95a1-7a11b60d2fe8/token
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

site_url: https://tangerine-unicorn-156050.netlify.app
display_url: https://tangerine-unicorn-156050.netlify.app

media_folder: "eutls-site/content/uploads"
public_folder: "/content/uploads"

collections:
  - name: "events"
    label: "Events"
    files:
      - file: "eutls-site/content/events.json"
        label: "Events"
        name: "events"
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - {label: "ID (unique, no spaces)", name: "id", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Category", name: "category", widget: "select", options: ["Panel", "Workshop", "Networking"]}
              - {label: "Date", name: "date", widget: "date", date_format: "YYYY-MM-DD", picker_utc: true}
              - {label: "Time", name: "time", widget: "string"}
              - {label: "Location", name: "location", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
  - name: "publications"
    label: "Publications"
    files:
      - file: "eutls-site/content/publications.json"
        label: "Newsletter & Articles"
        name: "publications"
        fields:
          - label: "Newsletter Issues"
            name: "newsletters"
            widget: "list"
            summary: "{{fields.issue}} — {{fields.title}}"
            fields:
              - {label: "ID (unique, no spaces)", name: "id", widget: "string"}
              - {label: "Issue Label", name: "issue", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Date", name: "date", widget: "string"}
              - {label: "Summary", name: "summary", widget: "text"}
              - {label: "Full Content", name: "body", widget: "text"}
          - label: "Articles"
            name: "articles"
            widget: "list"
            summary: "{{fields.title}} — {{fields.author}}"
            fields:
              - {label: "ID (unique, no spaces)", name: "id", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Category", name: "category", widget: "string"}
              - {label: "Author", name: "author", widget: "string"}
              - {label: "Read Time", name: "read_time", widget: "string"}
              - {label: "Full Content", name: "body", widget: "text"}
